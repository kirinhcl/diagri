name: Wiki site
# Builds docs/wiki into the website at https://kirinhcl.github.io/diagri/.
# Pull requests only build, so a link to a missing file, or to a missing heading on a page
# of the same language, fails before merge. main deploys. The script's own tests run in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - docs/wiki/**
      - docs/images/**
      - scripts/build_wiki_site.py
      - pyproject.toml
      - constraints-tested.txt
      - .github/workflows/wiki-site.yml
  pull_request:
    paths:
      - docs/wiki/**
      - docs/images/**
      - scripts/build_wiki_site.py
      - pyproject.toml
      - constraints-tested.txt
      - .github/workflows/wiki-site.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c constraints-tested.txt -e '.[docs]'
      - run: python scripts/build_wiki_site.py
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/wiki-site/public
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
